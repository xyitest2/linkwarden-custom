name: Zdalny Build Bezpiecznego Obrazu

on:
  schedule:
    - cron: '0 3 * * *' # Automatyczny start codziennie o 3:00 w nocy
  workflow_dispatch: # Tworzy wygodny przycisk do ręcznego uruchomienia

# JAWNE UPRAWNIENIA: Wyraźnie informujemy system GitHub, że ten skrypt 
# ma prawo czytać kod oraz zapisywać gotowe obrazy w rejestrze pakietów (packages).
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu Linkwardena
        uses: actions/checkout@v4.2.2
        with:
          repository: 'linkwarden/linkwarden'
          ref: 'main'

      - name: Podmiana pliku Dockerfile na nasz bezpieczny
        run: |
          curl -fsSL https://githubusercontent.com{{ github.repository }}/main/Dockerfile -o Dockerfile

      - name: Konfiguracja silnika Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Używamy wbudowanego tokenu GITHUB_TOKEN, który dzięki sekcji 'permissions' wyżej
          # ma teraz pełne prawa zapisu bez polegania na zewnętrznych kluczach.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i wysyłka na zdalny rejestr
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/linkwarden:alpinebased
