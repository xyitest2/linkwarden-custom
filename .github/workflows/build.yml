name: Linkwarden personal docker build

on:
  schedule:
    - cron: '0 3 * * *' # Automatyczny start codziennie o 3:00 w nocy
  workflow_dispatch: # Tworzy wygodny przycisk do ręcznego uruchomienia

permissions:
  contents: read
  packages: write
  security-events: write # Ta linia pozwala naprawić błąd "Resource not accessible"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # KROK NAPRAWCZY 1: Usunięcie zbędnego oprogramowania i śmieci z runnera GitHub przed startem
      - name: 🛠️ Sprzątanko (kluczowe dla dużych obrazów)
        run: |
          echo "Dysk przed czyszczeniem:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Dysk po czyszczeniu:"
          df -h
      - name: 1. Pobranie bezpiecznego Dockerfile
        uses: actions/checkout@v4.2.2
        with:
          path: 'moje-repo' # Zapisuje Twoje pliki w osobnym podfolderze

      - name: 2. Pobranie kodu źródłowego Linkwardena
        uses: actions/checkout@v4.2.2
        with:
          repository: 'linkwarden/linkwarden'
          ref: 'main'
          path: 'linkwarden-src' # Zapisuje kod Linkwardena w osobnym podfolderze

      - name: 3. Przeniesienie bezpiecznego Dockerfile do kodu aplikacji
        run: |
          cp moje-repo/Dockerfile linkwarden-src/Dockerfile

      - name: 4. Konfiguracja silnika Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: 5. Logowanie do GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Budowanko
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./linkwarden-src # Budujemy obraz wewnątrz folderu z kodem aplikacji
          file: ./linkwarden-src/Dockerfile # Wskazujemy na nasz podmieniony plik
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/linkwarden:patched

      # KROK NAPRAWCZY 2: Czyszczenie cache Buildx PRZED skanowaniem Trivy.
      # Buildx zostawia po sobie gigabajty danych tymczasowych. Musimy je usunąć,
      # aby Trivy miało miejsce na rozpakowanie warstw obrazu w /tmp.
      - name: 🧹 Pruning Docker Build Cache
        run: |
          docker builder prune -f
          df -h

      # NOWY KROK: Trivy skanuje lokalnie załadowany obraz
      - name: 7. Skanowanie bezpieczeństwa narzędziem Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/linkwarden:patched'
          format: 'sarif' # Zmieniamy z table na sarif
          output: 'trivy-results.sarif'
          exit-code: '1'             # Zgłoś błąd i przerwij workflow, jeśli znajdziesz podatności
          ignore-unfixed: true       # Ignoruj luki, które nie mają jeszcze oficjalnej łatki naprawczej
          severity: 'CRITICAL,HIGH'  # Skup się wyłącznie na krytycznych i wysokich zagrożeniach
          # Przekazujemy token bezpośrednio do Trivy - to klucz do ominięcia błędu:
          # github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 8. Przesłanie raportu do zakładki Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Wyślij raport zawsze, nawet jeśli Trivy znajdzie błędy
        with:
          sarif_file: 'trivy-results.sarif'

      # NOWY KROK: Jeśli test Trivy przejdzie pomyślnie, wysyłamy sprawdzony obraz do rejestru ghcr.io
      - name: 9. Wysyłka bezpiecznego obrazu na zdalny rejestr
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/linkwarden:patched
